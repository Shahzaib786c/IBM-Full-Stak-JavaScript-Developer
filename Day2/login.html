<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login">
        <h3>Final Project Build a working Signup Form.</h3>
        <div class="name">
            <label for="name">Enter Your Name</label>
            <input id="name" type="text" name="name" placeholder="Your full name" />
        </div>
        <div class="email">
            <Label for="email">Enter your Email</Label>
            <input id="email" type="email" name="email" placeholder="you@example.com">
        </div>
        <div class="password">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Create a password">
        </div>
        <div class="gender">
            <label for="Gender">Select Your Gender</label>
            <label for="Male">Male
                <input id="Male" type="radio" name="gender" value="Male"></label>
            <label for="Female">Female
                <input id="Female" type="radio" name="gender" value="Female"></label>
        </div>
        <div class="country">
            <label for="country" title="country">Select your country</label>
            <select id="country">
                <option>Pakistan</option>
                <option>England</option>
                <option>Algeria</option>
                <option>Nigeria</option>
                <option>Switzerland</option>
            </select>
        </div>
        <div class="about">
            <label for="about">About yourself</label>
            <textarea id="about" placeholder="Tell us about yourself"> </textarea>
        </div>
        <div class="CB">
            <label for="terms">
                <input id="terms" type="checkbox" name="terms"> I agree terms</label>
        </div>
        <div class="btn">
            <button type="submit">Submit</button>
        </div>

    </div>
</body>

</html>
