<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Final Project Build a working Signup Form.</h1>
    <form>
        <label for="name">Enter Your Name</label>
        <input id="name" type="text" name="name" placeholder="Your full name" />
        <br>
        <Label for="email">Enter your Email</Label>
        <input id="email" type="email" name="email" placeholder="you@example.com">
        <br>
        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="Create a password">
        <br>
        <label for="Gender">Select gender Your Gender</label>
        
        
        <label for="Male">Male</label>
        <input id="Male" type="radio" name="gender" value="Male">
        <label for="Female">Female</label>
<input id="Female" type="radio" name="gender" value="Female">
        <h3>Select your country...</h3>
        <label for="country">Select your country</label>
        <select id="country">
            <option>Pakistan</option>
            <option>England</option>
            <option>Algeria</option>
            <option>Nigeria</option>
            <option>Switzerland</option>
        </select>
        <br>
        <br>
        <label for="about">About yourself</label>
        <textarea id="about" placeholder="Tell us about yourself"> </textarea>
        <br>
        <br>
        <label for="terms">
            <input id="terms" type="checkbox" name="terms"> I agree to the terms</label>
        <br>
        <button type="submit">Submit</button>
    </form>

</body>

</html>
