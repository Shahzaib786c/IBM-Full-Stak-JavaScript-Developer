<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absoulute</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .main {
            width: 100%;
            height: 100vh;
            background-color: blueviolet;
            border: 2px solid black;
            padding: 100px 100px;
            

        }

        .main .child {
            position: relative;
            width: 200px;
            height: 150px;
            border: 2px solid wheat;
            margin: 150px 250px;
        }
        

        .main .child h3 {

            position: absolute;
            left: 50px;
            top: -33px;
            background-color: wheat;
            padding: 5px 25px;

        }
    </style>
</head>

<body>
    <div class="main">
        <h1>This is Absoulute Positioning 🎉🎉🎉🥱🥱🥱🥱 </h1>
        <div class="child">
            <h3>Sales</h3>
        </div>
    </div>
</body>

</html>
