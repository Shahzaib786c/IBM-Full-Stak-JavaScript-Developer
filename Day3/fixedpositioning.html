<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .main {
            width: 100%;
            height: 100vh;
        }

        .main .chat {
            position: fixed;
            width: 60px;
            height: 60px;
            background-color: black;
            bottom: 80px;
            right: 20px;
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main .chat h2 {
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>

<body>
    <div class="main">
        <h1>This is Fixed Positioning.....  U can Addd Emoji using ( Window +. )</h1>
        <div class="chat">
            <h2>💬</h2>
        </div>
        <div class=""></div>
    </div>
</body>

</html>
