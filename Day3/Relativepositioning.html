<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .cards {
            width: 100%;
            height: 100vh;
            background-color: black;
            padding: 40px;

        }

        h1 {
            color: aliceblue;
        }

        .cards .card {
            width: 150px;
            height: 100px;
            background-color: aqua;
            margin-left: 500px;
            margin-top: 50px;
        }

        .cards .card2 {
            background-color: aquamarine;
            position: relative;
            left: 200px;
            bottom: 150px;

        }

        h3 {
            margin-left: 25px;
            padding-top: 40px;
        }
    </style>
</head>

<body>
    <div class="cards">
        <h1>This is Relative Positioning</h1>
        <div class="card"></div>
        <div class="card card2">
            <h3>Positioning</h3>
        </div>
        <div class="card"></div>

    </div>
</body>

</html>
