<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            position: sticky;
            top: 0;
            width: 100%;
            height: 80px;
            background-color: antiquewhite;
            display: flex;
            justify-content: center;
            align-items: center;
            justify-content: space-between;
        }

        .navbar .logo {
            margin-left: 30px;
            font-size: x-large;
            color: black;
        }

        .navbar .navlinks {
            margin-right: 30px;
            display: flex;
            gap: 30px;
        }

        .navbar .navlinks a {
            text-decoration: none;
            color: black;

        }

        .banner {
            width: 100%;
            height: 400px;
            background-color: aqua;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            width: 100%;
            height: 400px;
            background-color: black;
            padding: 200px 400px;
        }
        .card h1{
            color: aliceblue;
        }

        h2 {
            font-family: fantasy;
        }
        p{
            font-size: xx-large;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            Centurion
        </div>
        <div class="navlinks">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Track</a>
        </div>
    </nav>
    <section class="banner">
        <p>This is Sticky Practise</p>
        <h1>Bhi Navbar dekh Chipka diya 😭😭</h1>
        <h2>Scroll ker BSDK 👆☝️</h2>

    </section>
    <section class="card">
        <h1>Han bhi hoa kuch 🐊🦎</h1>
    </section>
</body>

</html>
